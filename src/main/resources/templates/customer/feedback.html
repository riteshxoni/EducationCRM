<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Student Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
    
    <div th:replace="customer/components/header :: header"></div>
    
    <!-- Profile Section Start -->
    <main style="min-height: 550px;">
        <div class="container mt-3">
            <div class="display-2 text-center fw-bold mt-5 mb-3">Feedback Form</div>
            <div class="col-8 col-md-5 mx-auto p-5 shadow-lg border rounded">
	            <div th:if="${success}" class="alert alert-success mb-3">
	           		<span th:text="${success}"></span>
	           	</div>
	           	<div th:if="${error}" class="alert alert-danger mb-3">
	           		<span th:text="${error}"></span>
	           	</div>
                <form action="/feedback" method="post" th:object="${feedback}">
                    <label class="form-label my-2">Your Name</label>
                    <input type="text" name="std_name" th:value="${sessionUser.name}"  class="form-control" required readonly>
                    <label class="form-label my-2">Your Email</label>
                    <input type="text" name="std_email" th:value="${sessionUser.email}"  class="form-control" required readonly>
                    <label class="form-label my-2">Course</label>
                    <input type="text" name="std_course"  class="form-control" required>
                    <label class="form-label my-2">Feedback</label>
                    <textarea name="std_message"  class="form-control" required rows="3"></textarea>
                    <button type="submit" class="btn btn-primary my-3">Send Feedback</button>
                </form>
            </div>
        </div>
    </main>
    <!-- Profile Section End -->

	<div th:replace="components/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
