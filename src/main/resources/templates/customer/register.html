<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Student Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
    
    <div th:replace="components/header :: header"></div>

    <main class="">
        <div class="container mt-3">
            <div class=" rounded display-4 text-center my-1 pt-1 pb-2 fw-bold">Register Here</div>
            <div class="row my-4 justify-content-center">
                <div class="col-10 col-md-6 border p-5 rounded shadow-lg">
	                <div th:if="${success}" class="alert alert-success mb-3">
	            		<span th:text="${success}"></span>
	            	</div>
	            	<div th:if="${error}" class="alert alert-danger mb-3">
	            		<span th:text="${error}"></span>
	            	</div>
                    <form action="register" method="post" onsubmit="return validateForm()" th:object="${user}">
                    	<div class="alert alert-danger mb-3 d-none" id="error"></div>
                    	
                        <label class="form-label">Name : </label>
                        <input type="text" name="name" class="form-control my-2" required th:field="*{name}">
                        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger mb-2"></div>
                        
                        <label class="form-label">Email : </label>
                        <input type="email" name="email" class="form-control my-2" required th:field="*{email}">
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger mb-2"></div>
                        
                        <label class="form-label">Password : </label>
                        <input type="password" name="password" class="form-control my-2" required th:field="*{password}">
                        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger mb-2"></div>
                        
                        <label class="form-label">Phone No. : </label>
                        <input type="tel" name="phoneno" class="form-control my-2" required th:field="*{phoneno}">
                        <div th:if="${#fields.hasErrors('phoneno')}" th:errors="*{phoneno}" class="text-danger mb-2"></div>
                        
                        <label class="form-label">City : </label>
                        <input type="text" name="city" class="form-control my-2" required th:field="*{city}">
                        <div th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="text-danger mb-2"></div>
                        
                        <button type="submit" class="btn btn-primary w-100 my-2">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

	<div th:replace="components/footer :: footer"></div>
	
   	<script type="text/javascript">
   		function validateForm()
   		{
	   		let name = document.forms[0]["name"].value;
	   		let namePattern = /^(?=.{2,50}$)(?!.*[.\-'\s]{2})[A-Za-z]+(?:[ .'\-][A-Za-z]+)*$/;
	   		
	   		let email = document.forms[0]["email"].value;
	   		let emailPattern = /^(?=.{6,254}$)[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,63}$/;
	   		
	   		let password = document.forms[0]["password"].value;
	   		let passwordPattern = /^(?=.{8,64}$)(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#\$%\^&\*\(\)\-_+\=\[\]\{\}\|;:'",<>\.?\/`~])[^\s]+$/;
	   		
	   		let phoneno = document.forms[0]["phoneno"].value;
	   		let phonenoPattern = /^(?:\+91[\-\s]?|91[\-\s]?|0)?[6-9]\d{9}$/;
	   		
	   		let city = document.forms[0]["city"].value;
	   		let cityPattern = /^(?=.{2,50}$)(?!.*[\s\-]{2})[A-Za-z]+(?:[ -][A-Za-z]+)*$/;
	   		
	   		let error = document.getElementById("error");
	   		
	   		if(!namePattern.test(name))
	   		{
	   			error.classList.toggle("d-none");
	   			error.textContent = "Invalid Name";
	   			return false;
	   		}
	   		if(!emailPattern.test(email))
	   		{
	   			error.classList.toggle("d-none");
	   			error.textContent = "Invalid Email";
	   			return false;
	   		}
	   		if(!passwordPattern.test(password))
	   		{
	   			error.classList.toggle("d-none");
	   			error.textContent = "Invalid Password";
	   			return false;
	   		}
	   		if(!phonenoPattern.test(phoneno))
	   		{
	   			error.classList.toggle("d-none");
	   			error.textContent = "Invalid Phone No";
	   			return false;
	   		}
	   		if(!cityPattern.test(city))
	   		{
	   			error.classList.toggle("d-none");
	   			error.textContent = "Invalid City";
	   			return false;
	   		}
   			return true;
   		}
   	</script>
   	
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
