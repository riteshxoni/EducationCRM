<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Student Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
    <div th:replace="components/header :: header"></div>

    <main class="" style="min-height: 500px;">
        <div class="container mt-5">
            <div class=" rounded display-4 text-center my-1 pt-1 pb-2  fw-bold">Login Here</div>
            <div class="row my-4 justify-content-center">
                <div class="col-10 col-md-6 border p-4 rounded shadow-lg">
                	<div th:if="${error}" class="alert alert-danger mb-3">
                		<span th:text="${error}"></span>
                	</div>
                    <form action="login" method="post">
                        <label class="form-label">Email : </label>
                        <input type="email" name="email" class="form-control my-2">
                        <label class="form-label">Password : </label>
                        <input type="password" name="password" class="form-control my-2">
                        <button type="submit" class="btn btn-primary w-100 my-2">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

	<div th:replace="components/footer :: footer"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
