<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
	
	<div th:replace="customer/components/header :: header"></div>
	
    <main class="" style="min-height: 550px;">
        <div class="container my-5">
            <div class="display-4 bg-light text-center fw-medium my-3">My Courses</div>
            <div class="row g-4 justify-content-center mt-3">
				
				<div th:if="${#lists.isEmpty(orderedCourses)}" class="text-danger display-2 text-center">
					Sorry, you didnt purchased any course yet...!!
				</div>
				
                <div class="col-10 col-md-6 col-lg-3" th:each="course : ${orderedCourses}">
                    <div class="card">
                        <img th:src="@{${course.image_url}}" class="card-img-top" height="150px" width="100%">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${course.name}" style="font-size: 100%;"></h5>
                            <p class="card-text" th:text="${course.description}" style="min-height: 50px;"></p>
                            <a href="#" class="btn btn-primary">Start Course</a>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><small class="text-body-secondary" th:text="${course.updated_on}"></small></li>
                        </ul>
						<ul class="list-group list-group-flush">
                            <li class="list-group-item"><small class="text-body-secondary" th:text="'Purchased On : ' + ${course.date_of_purchase}"></small></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Profile Section End -->
    <div th:replace="components/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
