<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
    
    <div th:replace="customer/components/header :: header"></div>
    
    <!-- Profile Section Start -->
    <main class="" style="min-height: 550px;">
        <div class="container mt-3">
            <div class="row align-items-center justify-content-center">
                <div class="col-4 my-3 myimg">
                    <img src="img/profile.png" class="img-fluid img-thumbnail rounded-circle" height="100%" width="100%">
                </div>
                <div class="col-12 col-md-8 border rounded shadow ">
                    <div class="display-5 text-center my-3">User Details</div>
                    <table class="table table-bordered table-hover table-responsive table-striped">
                        <tr>
                            <td>Name</td>
                            <td th:text="${sessionUser.name}"></td>
                        </tr>
                        <tr>
                            <td>Email</td>
                            <td th:text="${sessionUser.email}"></td>
                        </tr>
                        <tr>
                            <td>Phone No.</td>
                            <td th:text="${sessionUser.phoneno}"></td>
                        </tr>
                        <tr>
                            <td>City</td>
                            <td th:text="${sessionUser.city}"></td>
                        </tr>
                    </table>
                </div>
                <div class="col-12 my-3 text-center">
                    <a href="/mycourses" class="btn btn-success">My Courses</a>
                    <a href="/index" class="btn btn-primary">Shop</a>
                </div>
            </div>
        </div>
    </main>
    <!-- Profile Section End -->

	<div th:replace="components/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
