<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Course Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
	
   <div th:replace="admin/components/sidebar :: sidebar"></div>
   
    <div class="content">
        <div id="Dashboard">
            <h2 >Course Management</h2>
            <p>Here you can add new courses view courses and delete and update courses</p>

            <div class="mb-3 float-end">
                <a href="/admin/addCourse" class="btn btn-primary">Add New Course</a>
            </div>
			
			<div th:if="${success}" class="alert alert-success my-3"><span th:text="${success}"></span></div>
			<div th:if="${error}" class="alert alert-danger my-3"><span th:text="${error}"></span></div>
			
            <table class="table table-striped table-bordered table-hover">
                <tr>
                    <th>Name</th>
                    <th>Discounted Price</th>
                    <th>Course Image</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
				<div th:replace="admin/components/modal :: modal"></div>
                <tr th:each="course : ${courses.content}">
                    <td th:text="${course.name}"></td>
                    <td th:text="${course.discountedPrice}"></td>
                    <td >
						<img th:src="'/'+${course.imageUrl}" th:alt="${course.imageUrl}" height="80px" width="140px">
					</td>
                    <td >
                        <a th:href="@{/admin/editCourse(name=${course.name})}" class="text-decoration-none text-danger fs-1"><i class="bi bi-pencil-square"></i></a>    
                    </td>
                    <td >
                        <a href="#" th:data-courseName="${course.name}" 
						onclick="confirmDelete(event, '/admin/deleteCourse?name='+this.getAttribute('data-courseName'))" 
						class="text-decoration-none text-danger fs-1">
						
						<i class="bi bi-trash3-fill"></i></a>
						
                    </td>
                </tr>
            </table>
			<div th:replace="admin/components/pagination :: pagination"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
