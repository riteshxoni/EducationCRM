<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <style>
        html,body
        {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
  </head>
  <body>
    <div class="p-4 border rounded shadow-lg" style="width: 400px">
        <h3 class="text-decoration-underline my-4 text-center">Admin Login</h3>
        <div th:if="${error}" class="alert alert-danger mb-3">
       		<span th:text="${error}"></span>
       	</div>
        <form action="login" method="post">
            <label class="form-label">Email : </label>
            <input type="email"    name="email" class="form-control mb-3"  >
            <label class="form-label">Password :</label>
            <input type="password" name="password" class="form-control mb-3"  >
            <button type="submit" class="btn btn-primary mb-5 w-100">Login</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
