<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
	<div th:replace="admin/components/sidebar :: sidebar"></div>
    <div class="content">
        <div id="Dashboard">
            <h2>Settings</h2>
            <p>Here you can Change Password....</p>
        </div>
        <h1 class="text-center my-5">Admin Password Change</h1>
        <div class="p-5 w-75 mx-auto shadow-lg border">
        	<div th:if="${success}" class="alert alert-success my-3"><span th:text="${success}"></span></div>
			<div th:if="${error}" class="alert alert-danger my-3"><span th:text="${error}"></span></div>
        	<form action="/admin/changePassword" method="post" class="p-5">
        		<label class="form-label">Enter Current Password</label>
        		<input type="password" name="password" class="form-control my-3" id="pass1" required="required">
        		<label class="form-label">Enter New Password</label>
        		<input type="password" name="newPass" class="form-control my-3" id="pass2" required="required">
        		<label class="form-label">Enter Confirm New Password</label>
        		<input type="password" name="confirmNewPass" class="form-control my-3" id="pass3" required="required">
        		
        		<div class="d-flex py-3">
	        		<input type="checkbox" class="form-check-input me-2" onchange="showPassword()">
	        		<label class="form-label">Show Passwords</label>
        		</div>	
        		<button type="submit" class="btn btn-success my-3">Change Password</button>
        	</form>
        </div>
    </div>
    <script type="text/javascript">
    	function showPassword()
    	{
    		let p1 = document.getElementById("pass1");
    		let p2 = document.getElementById("pass2");
    		let p3 = document.getElementById("pass3");
    		if(p1.type === "password")
   			{
   				p1.type = "text";
   				p2.type = "text";
   				p3.type = "text";
   			}
    		else
   			{
   				p1.type = "password";
   				p2.type = "password";
   				p3.type = "password";
   			}
    	}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
