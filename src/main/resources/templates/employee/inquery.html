<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Employee Inquery Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="/css/emp_style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<style>
		.focus-none .form-control
		{
		  border: 0.5px solid gray;
		}
		.focus-none .form-control:focus
		{
		    box-shadow: none;
		   	border: 0.5px solid gray;
		}
		#continuebtn, #newbtn, #customerName, #inqueryTable
		{
			display: none;
		}
	</style>
	
  </head>
  <body>
	<div th:replace="/employee/components/sidebar :: sidebar"></div>
	<div th:replace="/employee/components/Inquerymodal :: Inquerymodal"></div>
	<div th:replace="/employee/components/searchByPhoneNo :: searchByPhoneNo"></div>
	<main>
	       <div class="content">
	           <div class="border-bottom mb-4">
	               <h2 th:text="'Welcome : '+${employee.name}"></h2>
	               <p>Employee Inquery Management Panel here you can search and add new inquiry</p>
	           </div>
			   
			   <div th:if="${success}" class="alert alert-success my-3"><span th:text="${success}"></span></div>
			   <div th:if="${error}" class="alert alert-danger my-3"><span th:text="${error}"></span></div>
			   
			   <div class="row align-items-center">
                   <div class="col-12 col-sm-5 col-md-6 text-center">
                       <div class="input-group focus-none">
                           <input name="phoneno" type="search" id="phoneno" class="form-control" placeholder="Search By Phone Number">
                           <button type="button" class="btn btn-secondary" onclick="searchInquery()"><i class="bi bi-search"></i></button>
                       </div>
                   </div>
                   <div class="col-6 col-sm-4 col-md-3 my-2">
                       <a id="continuebtn" href="#" class="btn btn-primary fw-bold fs-6 ms-3" data-bs-toggle="modal" data-bs-target="#continueQuery">Continue</a>
                   </div>
                   <div class="col-6 col-sm-3 col-md-3 text-center my-2">
                       <a id="newbtn" href="/employee/newInquery" class="btn btn-success fw-bold fs-6 float-end" >New</a>
                   </div>
               </div>
               <div class="my-3 display-6" id="customerName"></div>
               <div>
                   <table class="table table-bordered table-striped table-hover" id="inqueryTable">
						<thead>
							<tr class="table-dark border">
	                           <th>Intrested Course</th>
	                           <th>Discussion</th>
	                           <th>Inquery Type</th>
	                           <th>Call Type</th>
	                           <th>Inquery Date/Time</th>
	                           <th>Status</th>
	                       </tr>
						</thead>
						<tbody id="tbody">
							
						</tbody>
                       
                   </table>
               </div>
	       </div>
	   </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
