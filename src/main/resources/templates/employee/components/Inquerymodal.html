<!-- Modal -->
 <div class="modal fade" id="continueQuery" th:fragment="Inquerymodal">
  <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
      <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Inquery</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
         <div class="modal-body ">
                <form action="/employee/continueInquery" method="post" th:object="${inquery}">
                  <label class="form-label">Customer Phone No.</label>
                  <input type="text" name="phoneno" id="phone" class="form-control" readonly="readonly">
                  <label class="form-label">Customer Name</label>
                  <input type="text" name="customerName" id="name" class="form-control" readonly="readonly">
                  <label class="form-label">Intrested Course</label>
                  <Select name="interestedCourse" class="form-control">
                      <option value="" disabled selected>Select Course</option>
				   <option th:each="name : ${courseNames}" th:value="${name}" th:text="${name}"></option>
				   <option value="other">Other Course</option>
                  </Select>
                  <label class="form-label">Discusstion</label>
                  <textarea name="discussion" class="form-control" rows="3"></textarea>
			   
                  <label class="form-label">Inquery Type</label>
                  <select name="inqueryType" class="form-control">
                      <option value="Call">Call</option>
                      <option value="Mail">Mail</option>
                      <option value="Website">Website</option>
                      <option value="Social Media">Social Media</option>
                      <option value="Friend Reference">Friend Reference</option>
                      <option value="Advertisements">Advertisements</option>
                      <option value="Other">Other</option>
                  </select>
                  <label class="form-label">Call Type</label>
                  <Select name="callType" class="form-control">
                      <option value="Inbound Call">Inbound Call(Customer Calls to Company)</option>
                      <option value="Outbound Call">Outbound Call(Company Calls to Customer)</option>
                  </Select>
                  <label class="form-label">Status</label>
                  <Select name="status" id="status" class="form-control" onchange="toggleDate()">
                      <option value="Intrested-(Follow Up)">Intrested-(Follow Up)</option>
                      <option value="Intrested-(Closed)">Intrested-(Closed)</option>
                      <option value="Not Intrested-(Closed)">Not Intrested-(Closed)</option>
                      <option value="Purchased-(Closed)">Purchased-(Closed)</option>
                      <option value="Other-(Closed)">Other-(Closed)</option>
                  </Select>
			   <div id="date">
					<label class="form-label">Follow Up Date</label>
			   		<input type="date" name="followUpDate" class="form-control">
			   </div>
              	   <button type="submit" class="btn btn-primary my-3">Add Inquery</button>
           </form> 
         </div>
      </div>
  </div>
<script>
	function toggleDate()
	{
		let status = document.getElementById("status").value;
		let date = document.getElementById("date");
		if(status === "Intrested-(Follow Up)")
		{
			date.style.display = "block";
		}
		else
		{
			date.style.display = "none";
		}
	}
 </script>
 </div>
