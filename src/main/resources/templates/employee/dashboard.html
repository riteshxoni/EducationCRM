<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Employee Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="/css/emp_style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
	<div th:replace="/employee/components/sidebar :: sidebar"></div>
	<main>
	       <div class="content">
	           <div class="border-bottom mb-4">
	               <h2 th:text="'Welcome : '+${employee.name}"></h2>
	               <p>Employee Panel</p>
	           </div>
	           
	           <div class="row g-4 justify-content-center">
	               <div class="col-12 text-center">
	                   <img src="/img/profile.png" class="shadow-lg border border-5 rounded-circle" height="200px">
	               </div>
	               <div class="col-12">
	                   <h3>Employee Details</h3>
	                   <table class="table table-bordered table-striped table-hover">
	                       <tr>
	                           <th>Name</th>
	                           <td th:text="${employee.name}"></td>
	                       </tr>
	                        <tr>
	                           <th>Email</th>
	                           <td th:text="${employee.email}"></td>
	                       </tr>
	                        <tr>
	                           <th>Phone No.</th>
	                           <td th:text="${employee.phoneno}"></td>
	                       </tr>
	                        <tr>
	                           <th>City</th>
	                           <td th:text="${employee.city}"></td>
	                       </tr>
	                   </table>
	               </div>
	               <div class="col-12">
						<div class="text-center">
							<a href="#" class="btn btn-success">Sell Course</a>
		                   	<a href="#" class="btn btn-primary">Manage Inquery</a>
		                   	<a href="#" class="btn btn-secondary">Check Follow Ups</a>
						</div>
	                   
	               </div>
	           </div>
	       </div>
	   </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
