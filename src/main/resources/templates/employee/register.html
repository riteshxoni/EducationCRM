<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Employee Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
     <style>
        html, body
        {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
  </head>
  <body>
    <main style="width: 400px;">
        <div>
            <div class="rounded display-5 text-center my-3 fw-bold">Register Here</div>
            <div class="row justify-content-center">
				<div th:if="${success}" class="alert alert-success my-3"><span th:text="${success}"></span></div>
				<div th:if="${error}" class="alert alert-danger my-3"><span th:text="${error}"></span></div>
                <div class="col-12 border p-4 rounded shadow-lg">
                    <form action="/employee/register" method="post" th:object="${employee}">
                        <label class="form-label">Employee Name : </label>
                        <input type="text" name="name" class="form-control my-2">
                        <label class="form-label">Employee Email : </label>
                        <input type="email" name="email" class="form-control my-2">
                        <label class="form-label">Employee Password : </label>
                        <input type="password" name="password" class="form-control my-2">
                        <label class="form-label">Employee Phone No. : </label>
                        <input type="tel" name="phoneno" class="form-control my-2">
                        <label class="form-label">Employee City : </label>
                        <input type="text" name="city" class="form-control my-2">
                        <button type="submit" class="btn btn-primary w-100 my-2">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
