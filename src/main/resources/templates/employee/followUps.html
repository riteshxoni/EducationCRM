<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARProgramming | Employee FollowUps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="/css/emp_style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
    	#noFollowUp, #followUp, #followupCustomers
    	{
    		display: none;
    	}
    </style>
  </head>
  <body>
	<div th:replace="/employee/components/sidebar :: sidebar"></div>
	<div th:replace="/employee/components/Inquerymodal :: Inquerymodal"></div>
	<main>
	       <div class="content">
	           <div class="border-bottom mb-4">
	               <h2 th:text="'Welcome : '+${employee.name}"></h2>
	               <p>Employee FollowUps Management Panel here you can manage followups</p>
	           </div>
			   
			   <div class="card p-5 shadow-lg col-10 col-lg-8 mx-auto">
			   		<div id="date">
						<label class="form-label my-3">Select Follow Up Date</label>
				   		<input type="date" name="followUpDate" id="followUpDate"  class="form-control">
				    </div>
				    <div class="text-danger my-3 h2" id="noFollowUp">Sorry, no follow-ups found...!!</div>
				    <div id="followupCustomers">
					    <table class="table table-bordered table-striped table-hover my-3">
								<thead>
									<tr class="table-primary">
			                           <th>Customer Phone No</th>
			                           <th>See More</th>
			                       </tr>
								</thead>
								<tbody id="followuptbody">
								</tbody>
		                  </table>
				    </div>
			   </div>
			   
			   <div class="card p-3 shadow-lg col-12 mx-auto mt-5" id="followUp">
				   	<p class="text-primary my-3 h1">Discussion Details</p>
				   	<div class="display-6 my-3" id="customerName"></div>
				   	
				   	<div class="table-responsive">
					   	<table class="table table-bordered table-striped table-hover my-3 align-middle" >
								<thead>
									<tr class="table-primary">
			                           <th>Intrested Course</th>
			                           <th>Discussion</th>
			                           <th>Inquery Type</th>
			                           <th>Call Type</th>
			                           <th>Inquery Date/Time</th>
			                       </tr>
								</thead>
								<tbody id="tbody">
								</tbody>
		                  </table>
				   	</div>
				
				   	
	                  <button class="btn btn-primary my-3" data-bs-toggle="modal" data-bs-target="#continueQuery">Add New Discussion</button>
			   </div>
					
	       </div>
	  </main>
	  <div th:replace="/employee/components/Inquerymodal :: Inquerymodal"></div>
	  <div th:replace="/employee/components/getInqueryByPhone :: getInqueryByPhone"></div>
	  <div th:replace="/employee/components/getFollowUpsbydate :: getFollowUpsbydate"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
